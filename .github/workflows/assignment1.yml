name: assignment1

on:
  pull_request:
    paths: ['assignment1/**', '!assignment1/REPORT.md']
  push:
    branches: [main]
    paths: ['assignment1/**', '!assignment1/REPORT.md']

concurrency:
  group: assignment1-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: assignment1/terraform
      - name: Validate every environment
        working-directory: assignment1/terraform
        run: |
          for e in dev staging prod; do
            echo "== $e =="
            (cd "$e" && terraform init -backend=false -input=false && terraform validate)
          done

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: assignment1/terraform/staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
      - name: Configure AWS session credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws sts get-caller-identity
      - run: terraform init -input=false
      - run: terraform plan -input=false -out=tfplan
      - run: terraform apply -input=false tfplan

  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: assignment1/terraform/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
      - name: Configure AWS session credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws sts get-caller-identity
      - run: terraform init -input=false
      - run: terraform plan -input=false -out=tfplan
      - run: terraform apply -input=false tfplan
